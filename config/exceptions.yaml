###############################################################################
#
# QAlchemy Exception Catalog
#
# File:
#   config/exception_catalog.yaml
#
# Purpose:
#   Centralized exception catalog for all QAlchemy Core Services,
#   Feature Services, Support Scripts, and Infrastructure components.
#
# Startup Rules
#   BootstrapService
#       • verifies file exists
#       • verifies file is readable
#
#   ExceptionCatalog
#       • loads YAML
#
#   ExceptionHandlingService
#       • validates schema
#       • validates references
#       • builds lookup indexes
#       • formats exceptions
#
###############################################################################

metadata:
  framework: QAlchemy
  framework_version: "1.1.0"
  schema_version: "1.0"
  catalog_version: "1.0"
  description: "QAlchemy Exception Catalog"

###############################################################################
# VALID VALUES
###############################################################################

origins:
  - CoreService
  - FeatureService
  - SupportScript
  - Infrastructure

severities:
  - INFO
  - WARNING
  - ERROR
  - CRITICAL

categories:
  - Configuration
  - AI
  - Prompt
  - Template
  - Validation
  - Logging
  - Filesystem
  - Reporting
  - Application
  - Internal
  - Network
  - Security

###############################################################################
# COMPONENT REGISTRY
###############################################################################

components:

  CoreService:

    AppConfigurationService:
      status: active

    PromptLoaderService:
      status: active

    PromptBuilderService:
      status: active

    ClientBuilderService:
      status: active

    SourceCodePreprocessingService:
      status: active

    LoggerService:
      status: active

    ExceptionHandlingService:
      status: active

  FeatureService:

    CodeGenerationService:
      status: active

    CodeReviewService:
      status: active

    TestGenerationService:
      status: planned

    RequirementsEvaluationService:
      status: planned

  SupportScript:

    exception_catalog.py:
      status: active

    exception_models.py:
      status: active

    logger.py:
      status: active

    logger_config.py:
      status: active

  Infrastructure:

    Filesystem:
      status: active

    AIProvider:
      status: active

    ReportWriter:
      status: active

###############################################################################
# ERROR PREFIX REGISTRY
###############################################################################

prefixes:

  CFG:
    owner: AppConfigurationService

  PRM:
    owner: PromptLoaderService

  AI:
    owner: ClientBuilderService

  PRE:
    owner: SourceCodePreprocessingService

  GEN:
    owner: CodeGenerationService

  REV:
    owner: CodeReviewService

  LOG:
    owner: LoggerService

  RPT:
    owner: ReportWriter

  VAL:
    owner: ExceptionHandlingService

  FS:
    owner: Filesystem

  QAL:
    owner: ExceptionHandlingService

###############################################################################
# ERROR DEFINITIONS
###############################################################################

errors:

  CFG001:
    origin: CoreService
    owner: AppConfigurationService
    category: Configuration
    severity: CRITICAL
    recoverable: false
    message: "Application configuration file '{file}' could not be found."
    user_message: "Application configuration is missing."
    resolution: "Verify the configured application file exists."

  CFG002:
    origin: CoreService
    owner: AppConfigurationService
    category: Configuration
    severity: CRITICAL
    recoverable: false
    message: "Application configuration file is invalid."
    user_message: "Application configuration is invalid."
    resolution: "Correct the YAML syntax."

  CFG003:
    origin: CoreService
    owner: AppConfigurationService
    category: Configuration
    severity: ERROR
    recoverable: false
    message: "Required configuration property '{property}' is missing."
    user_message: "Required configuration is missing."
    resolution: "Add the missing property."

  PRM001:
    origin: CoreService
    owner: PromptLoaderService
    category: Prompt
    severity: ERROR
    recoverable: false
    message: "Prompt '{prompt}' could not be loaded."
    user_message: "Required prompt could not be loaded."
    resolution: "Verify the prompt file exists."

  PRM002:
    origin: CoreService
    owner: PromptLoaderService
    category: Prompt
    severity: ERROR
    recoverable: false
    message: "Prompt directory '{directory}' does not exist."
    user_message: "Prompt resources are unavailable."
    resolution: "Verify the configured prompt directory."

  PRM003:
    origin: CoreService
    owner: PromptBuilderService
    category: Prompt
    severity: ERROR
    recoverable: true
    message: "Required prompt variable '{variable}' is missing."
    user_message: "Prompt generation failed."
    resolution: "Supply the required prompt variables."

  AI001:
    origin: CoreService
    owner: ClientBuilderService
    category: AI
    severity: ERROR
    recoverable: false
    message: "Unsupported AI provider '{provider}'."
    user_message: "Unsupported AI provider."
    resolution: "Verify the provider configuration."

  AI002:
    origin: Infrastructure
    owner: AIProvider
    category: AI
    severity: ERROR
    recoverable: true
    message: "AI request timed out."
    user_message: "The AI provider timed out."
    resolution: "Retry the request."

  AI003:
    origin: Infrastructure
    owner: AIProvider
    category: AI
    severity: ERROR
    recoverable: true
    message: "AI provider returned an unexpected response."
    user_message: "The AI provider returned an invalid response."
    resolution: "Review provider connectivity."

  PRE001:
    origin: CoreService
    owner: SourceCodePreprocessingService
    category: Validation
    severity: ERROR
    recoverable: true
    message: "Source code preprocessing failed."
    user_message: "Unable to preprocess the source code."
    resolution: "Verify the source file."

  GEN001:
    origin: FeatureService
    owner: CodeGenerationService
    category: Application
    severity: ERROR
    recoverable: false
    message: "Code generation failed."
    user_message: "Unable to generate code."
    resolution: "Review AI configuration and prompts."

  REV001:
    origin: FeatureService
    owner: CodeReviewService
    category: Application
    severity: ERROR
    recoverable: false
    message: "Code review failed."
    user_message: "Unable to review the supplied source code."
    resolution: "Verify the source file and AI provider."

  LOG001:
    origin: CoreService
    owner: LoggerService
    category: Logging
    severity: ERROR
    recoverable: true
    message: "Unable to write log entry."
    user_message: "Logging is temporarily unavailable."
    resolution: "Verify log directory permissions."

  RPT001:
    origin: Infrastructure
    owner: ReportWriter
    category: Reporting
    severity: ERROR
    recoverable: true
    message: "Unable to write report '{file}'."
    user_message: "Report generation failed."
    resolution: "Verify report output location."

  FS001:
    origin: Infrastructure
    owner: Filesystem
    category: Filesystem
    severity: ERROR
    recoverable: true
    message: "File '{file}' could not be accessed."
    user_message: "Unable to access the requested file."
    resolution: "Verify the file path and permissions."

  VAL001:
    origin: CoreService
    owner: ExceptionHandlingService
    category: Validation
    severity: ERROR
    recoverable: false
    message: "Exception catalog validation failed."
    user_message: "Internal configuration validation failed."
    resolution: "Review the validation errors."

  QAL001:
    origin: CoreService
    owner: ExceptionHandlingService
    category: Internal
    severity: CRITICAL
    recoverable: false
    message: "Unhandled framework exception."
    user_message: "An unexpected application error occurred."
    resolution: "Review application logs."

  QAL002:
    origin: CoreService
    owner: ExceptionHandlingService
    category: Internal
    severity: ERROR
    recoverable: true
    message: "Unknown exception code '{code}'."
    user_message: "Unexpected application error."
    resolution: "Verify the exception catalog."

  QAL003:
    origin: CoreService
    owner: ExceptionHandlingService
    category: Internal
    severity: CRITICAL
    recoverable: false
    message: "Exception catalog could not be loaded."
    user_message: "Application initialization failed."
    resolution: "Verify the exception catalog exists and is readable."

  QAL004:
    origin: CoreService
    owner: ExceptionHandlingService
    category: Internal
    severity: CRITICAL
    recoverable: false
    message: "Exception catalog validation failed."
    user_message: "Application initialization failed."
    resolution: "Correct the catalog validation errors."