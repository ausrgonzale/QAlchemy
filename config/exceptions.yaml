########################################
# Configuration
########################################

CFG001:
  category: Configuration
  severity: ERROR
  title: Missing Configuration Property
  message: "Required configuration property '{property}' was not found."
  recommendation: Verify that the property is present in config/app.yaml.

CFG002:
  category: Configuration
  severity: ERROR
  title: Missing Configuration Section
  message: "Required configuration section '{section}' was not found."
  recommendation: Add the required section and its values to config/app.yaml.

CFG003:
  category: Configuration
  severity: CRITICAL
  title: Configuration File Not Found
  message: "Configuration file was not found: '{path}'."
  recommendation: Restore config/app.yaml and verify the application is running from a valid project checkout.

CFG004:
  category: Configuration
  severity: ERROR
  title: Configuration File Read Failed
  message: "Unable to read configuration file '{path}'."
  recommendation: Verify the file exists, is readable, and is not blocked by filesystem permissions.

CFG005:
  category: Configuration
  severity: ERROR
  title: Configuration YAML Parse Failed
  message: "Unable to parse YAML configuration file '{path}'."
  recommendation: Correct the YAML syntax and validate the configuration file.

CFG006:
  category: Configuration
  severity: ERROR
  title: Invalid Configuration Root
  message: "Configuration file '{path}' must contain a top-level mapping."
  recommendation: Ensure config/app.yaml contains a YAML mapping of application sections.

########################################
# Logging
########################################

LOG001:
  category: Logging
  severity: ERROR
  title: Log File Persistence Failed
  message: "Unable to create or write log file '{path}'."
  recommendation: Verify the log directory exists or can be created and that the application has write permission.

########################################
# Exception Framework
########################################

# Reserved for exception-framework failures. No ExceptionService or catalog
# implementation currently exists in the application.

########################################
# Application
########################################

APP001:
  category: Application
  severity: ERROR
  title: Source File Not Found
  message: "Source file was not found: '{path}'."
  recommendation: Provide an existing readable source file to the code-review command.

APP002:
  category: Application
  severity: ERROR
  title: Generated Code Write Failed
  message: "Unable to write generated code to '{path}'."
  recommendation: Verify the destination directory exists or can be created and that it is writable.

APP003:
  category: Application
  severity: ERROR
  title: Code Generation Workflow Failed
  message: "Code generation failed during the '{operation}' operation."
  recommendation: Review the linked configuration, prompt, preprocessing, and AI provider errors before retrying.

APP004:
  category: Application
  severity: ERROR
  title: Code Review Workflow Failed
  message: "Code review failed during the '{operation}' operation."
  recommendation: Review the linked configuration, prompt, report, and AI provider errors before retrying.

APP005:
  category: Application
  severity: ERROR
  title: Source Code Preprocessing Failed
  message: "Unable to preprocess source code during the '{operation}' operation."
  recommendation: Verify that the supplied source is valid Python and identify the preprocessing step that failed.

########################################
# Validation
########################################

VAL001:
  category: Validation
  severity: CRITICAL
  title: Repository Not Found
  message: "Project repository was not found at '{path}'."
  recommendation: Run the validator from an intact QAlchemy project checkout.

VAL002:
  category: Validation
  severity: CRITICAL
  title: Virtual Environment Not Found
  message: "Project virtual environment was not found at '{path}'."
  recommendation: Create the project virtual environment and install its dependencies.

VAL003:
  category: Validation
  severity: ERROR
  title: Required Project Path Missing
  message: "Required project path was not found: '{path}'."
  recommendation: Restore the required project directory or update the validator's project structure requirements.

VAL004:
  category: Validation
  severity: ERROR
  title: Unit Test Validation Failed
  message: "Unit tests failed during project validation."
  recommendation: Run the unit tests directly, fix the reported failures, and rerun validation.

VAL005:
  category: Validation
  severity: ERROR
  title: Project Validation Failed
  message: "Project validation failed: '{reason}'."
  recommendation: Review the validation output and resolve the underlying environment, configuration, structure, or test failure.

########################################
# AI Provider
########################################

AI001:
  category: AI Provider
  severity: ERROR
  title: AI Provider Dependency Missing
  message: "Required AI provider package '{package}' is not installed."
  recommendation: Install the required provider dependency in the active project environment.

AI002:
  category: AI Provider
  severity: ERROR
  title: AI Client Construction Failed
  message: "Unable to construct an AI client for provider '{provider}' and model '{model}'."
  recommendation: Verify AI configuration, provider availability, installed dependencies, and client initialization settings.

AI003:
  category: AI Provider
  severity: ERROR
  title: AI Provider Request Failed
  message: "AI provider request failed for provider '{provider}' and model '{model}'."
  recommendation: Verify the provider service is running, the model is available, and the request can complete within the configured timeout.

########################################
# Prompt
########################################

PRM001:
  category: Prompt
  severity: ERROR
  title: Prompt Load Failed
  message: "Unable to load prompt file '{path}'."
  recommendation: Verify the configured prompts directory, prompt filename, file encoding, and read permissions.

PRM002:
  category: Prompt
  severity: ERROR
  title: Prompt Assembly Failed
  message: "Unable to assemble prompts for task prompt '{task_prompt}'."
  recommendation: Verify the required standard and task prompt files are available and valid.

########################################
# Template
########################################

TMP001:
  category: Template
  severity: ERROR
  title: Report Template Load Failed
  message: "Unable to load report template '{path}'."
  recommendation: Verify the configured templates directory, template filename, file encoding, and read permissions.

########################################
# Reporting
########################################

RPT001:
  category: Reporting
  severity: ERROR
  title: Report Source File Missing
  message: "Runtime context source_file has not been set."
  recommendation: Set RuntimeContext.source_file before generating a default report destination.

RPT002:
  category: Reporting
  severity: ERROR
  title: Report Write Failed
  message: "Unable to create or write report '{path}'."
  recommendation: Verify the report destination directory can be created and that it is writable.

########################################
# System
########################################

SYS001:
  category: System
  severity: ERROR
  title: Command Execution Failed
  message: "Command failed with exit code '{exit_code}': '{command}'."
  recommendation: Review the command output, resolve its failure, and rerun the operation.

SYS002:
  category: System
  severity: ERROR
  title: Expected Artifact Missing
  message: "Expected artifact was not created: '{path}'."
  recommendation: Verify the preceding operation completed successfully and that its output path is correct.
