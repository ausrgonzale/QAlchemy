# =============================================================================
# QAlchemy Work Order
# =============================================================================
#
# Purpose
# -------
# Defines the engineering work to be performed by the QAlchemy application.
#
# A Work Order is the canonical engineering contract exchanged between the
# Orchestration Service and Feature Services.
#
# This file describes WHAT work is to be performed.
#
# Application behavior (AI providers, prompt rendering, validation,
# logging, reporting, etc.) is configured separately in app.yaml.
#
# Runtime Flow
# ------------
#
#     User Request
#          │
#          ▼
#   Orchestration Service
#          │
#          ▼
#     Work Order
#          │
#          ▼
#    Feature Service
#          │
#          ▼
#   PromptBuilderService
#          │
#          ▼
#      AI Provider
#
# Design Principles
# -----------------
# • Work is described, not executed.
# • Work Orders are provider independent.
# • Feature Services consume Work Orders.
# • One Work Order may contain one or more Units of Work.
#
# NOTE
# ----
# Version 1.2 supports a single executable Unit of Work.
# Multiple Units of Work will be introduced in a future release.
#
# =============================================================================

work_order:

  # ---------------------------------------------------------------------------
  # Work Order Metadata
  # ---------------------------------------------------------------------------

  metadata:

    target: "CodeGeneration"

    name: "Generate Production Python Code"

    description: >
      Generate production-ready Python source code from an engineering
      requirements document.

    priority: "NORMAL"

  # ---------------------------------------------------------------------------
  # Units of Work
  # ---------------------------------------------------------------------------

  units_of_work:

    - name: "Generate Source Code"

      objective: >
        Generate production-ready Python code from the supplied engineering
        requirements.

      # -----------------------------------------------------------------------
      # Prompt Instructions
      # -----------------------------------------------------------------------

      system_prompt:

        - "generation_instructions.md"

      user_instructions: []

      # -----------------------------------------------------------------------
      # Supporting Engineering Artifacts
      # -----------------------------------------------------------------------

      artifacts:

        - "python_standards.md"

        - "code_standards.md"

      # -----------------------------------------------------------------------
      # Execution Constraints
      # -----------------------------------------------------------------------

      constraints:

        language: "python"

      # -----------------------------------------------------------------------
      # Expected Response
      # -----------------------------------------------------------------------

      response_contract:

        format: "markdown"

        template: ""

        required_sections:

          - "Implementation"

      # -----------------------------------------------------------------------
      # Reserved for Future Releases
      # -----------------------------------------------------------------------

      execution_options: {}