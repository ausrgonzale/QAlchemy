# =============================================================================
# QAlchemy Application Configuration
# =============================================================================
#
# Purpose
# -------
# Central configuration registry for QAlchemy application behavior.
#
# Engineering work is represented by canonical Work Orders created at runtime.
#
# =============================================================================

# =============================================================================
# Application Metadata
# =============================================================================
app:

  name: "QAlchemy"

  version: "1.2.0"

  edition: "Community"


# =============================================================================
# AI Client Configuration
#
# Defines the default AI provider and execution settings.
# =============================================================================
client:

  provider: "ollama"

  default_model: "gpt-oss:120b-cloud"

  request_timeout: 120

  stream: false

  options:

    temperature: 0.2

    top_p: 0.95

    max_tokens: 4096

    seed: null


# =============================================================================
# Work Order Configuration
#
# Defines Work Order validation and persistent storage behavior.
#
# Work Orders are created at runtime from RuntimeRequests.
# =============================================================================
work_order:

  validation:

    enabled: true

    fail_on_missing_required_field: true

    fail_on_invalid_definition: true

  runtime:

    allow_multiple_units_of_work: false

    stop_on_validation_failure: true

    persist_to_disk: true

    directory: "work_orders"


# =============================================================================
# WorkSpace Configuration
#
# Defines the root location for Work Order execution workspaces.
#
# Each Work Order receives a uniquely identified workspace.
#
# Example:
#
#     work_space/
#         WOGCS20260823155841-7690/
#             output/
#
# =============================================================================
workspace:

  root: "work_space"


# =============================================================================
# Output Templates
#
# Templates used to render generated output.
# =============================================================================
templates:

  root: "templates"

  code_review_report: "code_review_report_template.md"


# =============================================================================
# Report Output
#
# Controls report generation and debug artifacts.
# =============================================================================
reports:

  output_root: "reports"

  debug_output_root: "reports/debug"

  review:

    output_directory: "reports/reviews/code_reviews"

    fields:

      source_file: true

      lines_reviewed: true

      provider: true

      model: true

      execution_time: true

      review_date: true


# =============================================================================
# Logging Configuration
#
# Defines application logging behavior.
# =============================================================================
logging:

  level: "INFO"

  output_root: "logs"

  base_filename: "qalchemy"

  extension: ".log"

  debug:

    enabled: true

    save_prompt: true

    save_response: true

    overwrite_files: true


# =============================================================================
# Exception Handling Configuration
#
# Defines application exception handling and exception catalog behavior.
# =============================================================================
exceptions:

  enabled: true

  catalog:

    root: "config"

    filename: "exceptions.yaml"

  defaults:

    unknown_exception_code: "QAL-EX-999"

    validation_exception_code: "QAL-EX-001"

    internal_exception_code: "QAL-EX-999"

  logging:

    log_exceptions: true

    include_stack_trace: true

  user_messages:

    expose_internal_errors: false